# ========== 正常场景 ==========
# 步骤1: 发送验证码
- 用例名称: 发送验证码_用于修改密码
  请求方法: POST
  请求地址: /sms/send
  请求体:
    phone: "13800138000"
  断言:
    状态码: 200
    字段断言:
      - 字段: msg
        期望值: success

# 步骤2: 验证码登录获取token
- 用例名称: 验证码登录_用于修改密码
  前置Redis: "fto:sms:code:{phone}"
  请求方法: POST
  请求地址: /login/phone
  请求体:
    phone: "13800138000"
    code: ${redis.code}
    deviceType: "web"
  断言:
    状态码: 200
    字段断言:
      - 字段: code
        期望值: 0
      - 字段: data.token
        不为空: true

# 步骤3: 修改密码（使用上面登录获取的token）
- 用例名称: 修改密码_正常场景
  请求方法: POST
  请求地址: /changePassword
  请求体:
    newPassword: "12345678"
  断言:
    状态码: 200
    字段断言:
      - 字段: code
        期望值: 0
      - 字段: msg
        期望值: "success"

# 步骤4: 使用新密码登录验证
- 用例名称: 账号密码登录_验证新密码
  请求方法: POST
  请求地址: /login
  请求体:
    account: "13800138000"
    password: "12345678"
    deviceType: "web"
  断言:
    状态码: 200
    字段断言:
      - 字段: code
        期望值: 0
      - 字段: msg
        期望值: "success"
      - 字段: data.token
        不为空: true
# 步骤4: 使用新密码登录验证
- 用例名称: 账号密码登录_验证新密码
  请求方法: POST
  请求地址: /login
  请求体:
    account: "13800138000"
    password: "12345678"
    deviceType: "web"
  断言:
    状态码: 200
    字段断言:
      - 字段: code
        期望值: 0
      - 字段: msg
        期望值: "success"
      - 字段: data.token
        不为空: true

- 用例名称: 在修改一次密码,oldpassword
  请求方法: POST
  请求地址: /changePassword
  请求体:
    oldPassword: "12345678"
    newPassword: "123456"
  断言:
    状态码: 200
    字段断言:
      - 字段: code
        期望值: 0
      - 字段: msg
        期望值: "success"


# ========== 异常场景 ==========
# 修改密码_密码为空
- 用例名称: 修改密码_密码为空
  请求方法: POST
  请求地址: /changePassword
  请求体:
    newPassword: ""
  断言:
    状态码: 200
    字段断言:
      - 字段: code
        期望值: 400
      - 字段: msg
        期望值: "newPassword: String should have at least 6 characters"

# 修改密码_密码过短
- 用例名称: 修改密码_密码过短
  请求方法: POST
  请求地址: /changePassword
  请求体:
    newPassword: "123"
  断言:
    状态码: 200
    字段断言:
      - 字段: code
        期望值: 400
      - 字段: msg
        期望值: "newPassword: String should have at least 6 characters"
      - 字段: data
        期望值: null

# 修改密码_密码过长
- 用例名称: 修改密码_密码过长
  请求方法: POST
  请求地址: /changePassword
  请求体:
