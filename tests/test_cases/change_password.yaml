# 修改密码_未登录（无token）
- 用例名称: 修改密码_未登录
  no_token: true
  请求方法: POST
  请求地址: /changePassword
  请求体:
    newPassword: "12345678"
  断言:
    状态码: 200
    字段断言:
      - 字段: code
        期望值: 401
      - 字段: msg
        期望值: "缺少认证信息"
      - 字段: data
        期望值: null
  后置SQL: UPDATE "fto_design"."t_user_auth" SET "password" = NULL WHERE "id" = 7427587293029863424