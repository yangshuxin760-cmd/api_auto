# 用户详情接口测试用例 - 根据用户ID获取用户详细信息（需要登录）

# ========== 前置：注册 + 登录，准备用户与 token ==========

- 用例名称: 用户注册_用于查询详情
  请求方法: POST
  请求地址: /register
  请求头:
    Content-Type: application/json
  请求体:
    username: detail_user_${timestamp}
    email: detail_user_${timestamp}@test.com
    password: testpass123
  断言:
    状态码: 200
    字段断言:
      - 字段: id
        不为空: true
      - 字段: username
        期望值: ${request.json.username}
      - 字段: email
        期望值: ${request.json.email}
    响应不为空: true

- 用例名称: 用户登录_获取token_用于查询详情
  请求方法: POST
  请求地址: /login
  请求头:
    Content-Type: application/json
  请求体:
    username: ${用户注册_用于查询详情.username}
    password: testpass123
  断言:
    状态码: 200
    字段断言:
      - 字段: token_type
        期望值: bearer
    响应不为空: true

# ========== 场景1：正常根据用户ID获取详情（已登录） ==========

- 用例名称: 根据用户ID获取用户详情_正常场景
  请求方法: GET
  # 使用注册接口返回的 id 作为路径参数
  请求地址: /users/${用户注册_用于查询详情.id}
  # Authorization 头部由框架根据登录接口返回的 token 自动注入，无需手写
  请求头:
    Content-Type: application/json
  断言:
    状态码: 200
    字段断言:
      - 字段: id
        期望值: ${用户注册_用于查询详情.id}
      - 字段: username
        期望值: ${用户注册_用于查询详情.username}
      - 字段: email
        期望值: ${用户注册_用于查询详情.email}
    响应不为空: true

# ========== 场景2：未登录访问，验证权限控制 ==========

- 用例名称: 根据用户ID获取用户详情_未登录_权限校验
  请求方法: GET
  # 这里同样使用已注册用户的ID
  请求地址: /users/${用户注册_用于查询详情.id}
  # 关键：不使用token
  不使用token: true
  请求头:
    Content-Type: application/json
  断言:
    状态码: 403        
    字段断言:
      - 字段: detail
        不为空: true
    响应不为空: true