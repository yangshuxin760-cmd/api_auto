
# ========== 正常场景 ==========
- 用例名称: 发送验证码_用于登录
  请求方法: POST
  请求地址: /sms/send
  请求体:
    phone: "13800138000"
  断言:
    状态码: 200
    字段断言: 
      - 字段: msg
        期望值: success

- 用例名称: 手机验证码登录_正常场景
  前置Redis: "fto:sms:code:{phone}"
  请求方法: POST
  请求地址: /login/phone
  请求体:
    phone: "13800138000"
    code: ${redis.code}
    deviceType: "web"
  断言:
    状态码: 200
    字段断言:
      - 字段: data.username
        期望值: "用户uCJC8z4zcu"


#========== 异常场景 ==========

- 用例名称: 手机验证码登录_手机号为空
  请求方法: POST
  请求地址: /login/phone
  请求体:
    phone: ""
    code: "222222"
    deviceType: "web"
  断言:
    状态码: 200
    字段断言:
      - 字段: code
        期望值: 400
      - 字段: msg
        期望值: "phone: String should have at least 11 characters"


