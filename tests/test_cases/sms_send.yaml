# 发送手机验证码接口测试用例 - 中文关键字驱动

# ========== 正常场景 ==========

- 用例名称: 发送手机验证码_正常场景
  请求方法: POST
  请求地址: /sms/send
  请求体:
    phone: "13800138000"
  断言:
    状态码: 200
    字段断言: 
      - 字段: msg
        期望值: success

# ========== 异常场景 ==========

- 用例名称: 发送验证码_手机号为空字符串
  请求方法: POST
  请求地址: /sms/send
  请求体:
    phone: ""
  断言:
    状态码: 200
    字段断言:
      - 字段: code
        期望值: 400
      - 字段: msg
        期望值: "phone: String should have at least 11 characters"


- 用例名称: 发送验证码_缺少手机号参数
  请求方法: POST
  请求地址: /sms/send
  请求体: {}
  断言:
    状态码: 200
    字段断言:
      - 字段: code
        期望值: 400
      - 字段: msg
        期望值: "phone: Field required"

- 用例名称: 发送验证码_手机号格式错误_非数字
  请求方法: POST
  请求地址: /sms/send
  请求体:
    phone: "138abc12345"
  断言:
    状态码: 200
    字段断言:
      - 字段: code
        期望值: 400
      - 字段: msg
        期望值: "phone: String should match pattern '^1[3-9]\\d{9}$'"

