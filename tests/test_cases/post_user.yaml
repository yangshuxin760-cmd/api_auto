
- 用例名称: 用户注册_用于创建文章
  请求方法: POST
  请求地址: /register
  请求头:
    Content-Type: application/json
  请求体:
    username: detail_user_${timestamp}
    email: detail_user_${timestamp}@test.com
    password: testpass123
  断言:
    状态码: 200
    字段断言:
      - 字段: id
        不为空: true
      - 字段: username
        期望值: ${request.json.username}
      - 字段: email
        期望值: ${request.json.email}
    响应不为空: true

- 用例名称: 用户登录_获取token
  请求方法: POST
  请求地址: /login
  请求头:
    Content-Type: application/json
  请求体:
    username: ${用户注册_用于创建文章.username}
    password: testpass123
  断言:
    状态码: 200
    字段断言:
      - 字段: access_token
        不为空: true

- 用例名称: 用户创建文章
  请求方法: POST
  请求地址: /posts
  请求头:
    Content-Type: application/json
  请求体:
    title: "haha123哈哈"
    content: "test"
  断言:
    状态码: 200
    字段断言:
      - 字段: id
        不为空: true
