# 用户登录接口测试用例 - 中文关键字驱动

# ========== 正常场景 ==========

- 用例名称: 用户注册_用于登录测试
  用例描述: 先注册一个用户，用于后续登录测试
  请求方法: POST
  请求地址: /register
  请求头:
    Content-Type: application/json
  请求体:
    username: login_user_${timestamp}
    email: login_user_${timestamp}@test.com
    password: testpass123
  断言:
    状态码: 200
    字段断言:
      - 字段: id
        不为空: true
      - 字段: username
        期望值: ${request.json.username}
    响应不为空: true

- 用例名称: 用户登录_正常场景
  用例描述: 测试用户正常登录功能，验证登录接口是否正常工作，返回token字符串
  请求方法: POST
  请求地址: /login
  请求头:
    Content-Type: application/json
  请求体:
    username: ${用户注册_用于登录测试.username}
    password: testpass123
  断言:
    状态码: 200
    字段断言:
      - 字段: token_type
        期望值: bearer
  

# ========== 异常场景 ==========
- 用例名称: 用户登录_用户名不存在
  用例描述: 测试使用不存在的用户名登录，应该返回401错误
  请求方法: POST
  请求地址: /login
  请求头:
    Content-Type: application/json
  请求体:
    username: not_exist_user_${timestamp}
    password: testpass123
  断言:
    状态码: 401
    字段断言: 
      - 字段: detail
        期望值: Invalid credentials

- 用例名称: 用户登录_密码错误
  用例描述: 测试使用错误密码登录，应该返回401错误
  请求方法: POST
  请求地址: /login
  请求头:
    Content-Type: application/json
  请求体:
    username: ${用户注册_用于登录测试.username}
    password: wrong_password
  断言:
    状态码: 401
    字段断言: 
      - 字段: detail
        期望值: Invalid credentials

- 用例名称: 用户登录_缺少用户名
  用例描述: 测试缺少必填字段username的场景，应该返回422验证错误
  请求方法: POST
  请求地址: /login
  请求头:
    Content-Type: application/json
  请求体:
    password: testpass123
  断言:
    状态码: 422
    字段断言:
      - 字段: detail.0.msg
        期望值: Field required
      - 字段: detail.0.loc.0
        期望值: body
      - 字段: detail.0.loc.1
        期望值: username

- 用例名称: 用户登录_缺少密码
  用例描述: 测试缺少必填字段password的场景，应该返回422验证错误
  请求方法: POST
  请求地址: /login
  请求头:
    Content-Type: application/json
  请求体:
    username: login_user_${timestamp}
  断言:
    状态码: 422
    字段断言:
      - 字段: detail.0.msg
        期望值: Field required
      - 字段: detail.0.loc.1
        期望值: password


