# 完整的用户注册接口测试用例 - 展示框架各项功能（中文关键字驱动）

# ========== 正常场景 ==========

- 用例名称: 用户注册_正常场景
  用例描述: 测试用户正常注册功能，验证注册接口是否正常工作，包含完整的断言
  请求方法: POST
  请求地址: /register
  请求头:
    Content-Type: application/json
  请求体:
    username: autotest_${timestamp}
    email: autotest_${timestamp}@test.com
    password: testpass123
  断言:
    状态码: 200
    字段断言:
      - 字段: id
        不为空: true
      - 字段: username
        期望值: ${request.json.username}
      - 字段: email
        期望值: ${request.json.email}
      - 字段: is_admin
        不为空: true
      - 字段: created_at
        不为空: true
    响应不为空: true

# ========== 异常场景 ==========

- 用例名称: 用户注册_用户名已存在
  用例描述: 测试注册时用户名已存在的场景，应该返回400错误
  请求方法: POST
  请求地址: /register
  请求头:
    Content-Type: application/json
  请求体:
    username: new_user_1767790392
    email: new_user_1767790392@test.com
    password: testpass123
  断言:
    状态码: 400
    字段断言:
      - 字段: detail
        期望值: Username already exists

