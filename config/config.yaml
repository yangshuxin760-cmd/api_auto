# 框架配置文件
base_url: http://173.249.27.176:8000
timeout: 30

# 数据库配置
database:
  host: localhost
  port: 3306
  user: root
  password: password
  database: test_db
  charset: utf8mb4

# Token配置
token:
  # Token存储的响应字段路径，例如: access_token 或 data.token
  # 登录接口返回格式: {"access_token": "...", "token_type": "bearer"}
  field_path: access_token
  # Token在请求头中的key
  header_key: Authorization
  # Token前缀，例如: Bearer
  prefix: Bearer

# 钉钉通知配置
dingtalk:
  # 钉钉机器人Webhook地址
  webhook_url: "https://oapi.dingtalk.com/robot/send?access_token=577895ff2873595bdd9ecee5a2fc10d35b3d45ae022d02cb8d96704acad6c9ea"
  # 钉钉机器人密钥（可选，用于签名验证）
  secret: "SEC1a3b11900103df2ec52b10147b285e26eea80f3e038882802a09537c58d3f7a4"
  # @的手机号列表（可选）
  at_mobiles: [17620915891]
  # 是否@所有人（可选，默认false）
  at_all: false
  # 是否在本地环境强制发送（可选，默认false，仅在CI环境中自动发送）
  # 设置为true时，即使在本地环境也会发送钉钉通知
  force_send_in_local: false

# 日志配置
logging:
  # 日志级别: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: INFO
  # 日志文件目录
  dir: logs
  # 是否启用文件日志
  enable_file: true
  # 是否启用控制台日志
  enable_console: true
  # 是否使用JSON格式（结构化日志）
  enable_json: false
  # 单个日志文件最大字节数（默认10MB）
  max_bytes: 10485760
  # 保留的日志文件数量
  backup_count: 5